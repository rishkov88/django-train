{% extends "products/bases.html" %}

{% block content %}
<center>
    <h3 style="color: green;"> {{message}} </h3>
    <form method="post" action="{% url 'delete' my_id %}" enctype="multipart/form-data">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">Delete</button>
        <button class="btn btn-primary"><a href="{% url 'table' %}" class="text-white">Cancel</a></button>
    </form>
</center>

{% endblock %}
